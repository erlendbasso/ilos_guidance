[package]
name = "ilos_guidance"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
nalgebra = {version ="0.34", features = ["serde-serialize"]}
csv = "1.3"
tokio = { version = "1.41.0", features = ["full"], optional = true }
# zenoh = { git = "https://github.com/eclipse-zenoh/zenoh.git", optional = true }
zenoh = { version = "1.6", optional = true }
serde = { version = "1.0.213", features = ["derive"], optional = true }
serde_derive = { version = "1", optional = true }
serde_json = {version = "1", optional = true}
serde_yaml = {version = "0.9", optional = true}
cdr = {version = "0.2.4", optional = true}
clap = {version = "4.5.20", features = ["derive"], optional = true}

[profile.test] 
opt-level = 3

[features]
zenoh = ["dep:zenoh", "dep:tokio", "dep:serde", "dep:serde_derive", "dep:cdr", "dep:clap", "dep:serde_json", "dep:serde_yaml"]

[[bin]]
name = "ilos_circle"
required-features = ["zenoh"]
[[bin]]
name = "ilos_waypoints"
required-features = ["zenoh"]
[[bin]]
name = "ilos_lemniscate"
required-features = ["zenoh"]
[[bin]]
name = "alos_lemniscate"
required-features = ["zenoh"]
[[bin]]
name = "spatial_los_lemniscate"
required-features = ["zenoh"]